name: Deploy

# Deploys main to Cloudflare (https://slump-bryggeri.brage-steen.workers.dev).
# Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (repository or "production" environment);
# without them the job only prints a notice (see docs/implementation-plan.md, M1.3).
# The "production" environment lets you add required reviewers in GitHub → Settings → Environments.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID mangler – hopper over deploy (docs/implementation-plan.md, M1.3)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      # Install, typecheck and test run without Cloudflare credentials in their environment.
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npm run typecheck
      - if: steps.creds.outputs.ok == 'true'
        run: npm test
      - name: Apply D1 migrations
        if: steps.creds.outputs.ok == 'true'
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
